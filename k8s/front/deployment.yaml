apiVersion: apps/v1
kind: Deployment

metadata:
  name: rose-academy-front
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rose-academy-front

  template:
    metadata:
      labels:
        app: rose-academy-front

    spec:
      containers:
        - name: front

          image: ghcr.io/ryandrop/rose-academy-front:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 3000
