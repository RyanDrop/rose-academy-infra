apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rose-front
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ryandrop/rose-infra.git
    targetRevision: main
    path: k8s/front

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
